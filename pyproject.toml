[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm[toml]",
    "wheel",
]
build-backend = 'setuptools.build_meta'

[project]
name = "hissw"
dynamic = ["version"]
description = "Seamlessly integrate SSWIDL code into your Python workflow"
readme = {file="README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name="Will Barnes", email="will.t.barnes@gmail.com"},
    {name="Bin Chen"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
keywords = [
    "solar",
    "sun",
    "ssw",
    "solar-physics",
    "idl",
    "sswidl",
    "solarsoft",
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.5",
    "numpy>=2.3.0",
    "scipy>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/wtbarnes/hissw/"
Documentation = "https://wtbarnes.github.io/hissw/"
Source = "https://github.com/wtbarnes/hissw/"

[project.optional-dependencies]
all = ["hissw"]
astropy = ["hissw", "astropy>=6.1.7"]
test = ["hissw[all]", "pytest>=8.3.4", "astropy>=6.1.7"]
docs = ["hissw[all]", "mkdocs>=1.6.0", "mkdocs-material>=9.5.46"]
dev = ["hissw[test,docs]"]

[tool.setuptools.packages.find]
include = ["hissw*"]

[tool.setuptools.package-data]
hissw = ["templates/*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
# So that hissw/conftest.py, which defines --idl-home, is loaded before the options are parsed
testpaths = ["hissw"]

[tool.codespell]
skip = "*.fts,*.fits,venv,*.pro,*.asdf,*.sh"
